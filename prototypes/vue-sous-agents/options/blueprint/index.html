<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blueprint · Atlas</title>
  <link rel="stylesheet" href="../../commun/commun.css">
  <link rel="stylesheet" href="../../commun/clair.css">
  <style>
    :root {
      --papier: #fafaf8;
      --grille-fine: #efefeb;
      --grille-majeure: #e0e0db;
      --t-texte: #c026d3;
      --t-entier: #0891b2;
      --t-reel: #65a30d;
      --exec: #3f3f46;
      --choix: #2563eb;
    }

    /* ─── Papier millimétré ─── */
    .scene {
      cursor: grab;
      user-select: none;
      background-color: var(--papier);
      background-image:
        linear-gradient(var(--grille-majeure) 1px, transparent 1px),
        linear-gradient(90deg, var(--grille-majeure) 1px, transparent 1px),
        linear-gradient(var(--grille-fine) 1px, transparent 1px),
        linear-gradient(90deg, var(--grille-fine) 1px, transparent 1px);
      background-size: 128px 128px, 128px 128px, 16px 16px, 16px 16px;
    }
    .scene:active { cursor: grabbing; }

    .monde { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
    .commentaires, .noeuds { position: absolute; left: 0; top: 0; }
    .fils { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; }

    /* ─── Boîtes « Comment » ─── */
    .commentaire {
      position: absolute; left: 0; top: 0; border-radius: 4px;
      background: color-mix(in srgb, var(--c) 6%, transparent);
      border: 1px solid color-mix(in srgb, var(--c) 38%, transparent);
    }
    .commentaire .c-titre {
      height: 28px; padding: 0 10px; display: flex; align-items: center; gap: 8px;
      font: 500 12px var(--mono); color: color-mix(in srgb, var(--c) 85%, #000);
      background: color-mix(in srgb, var(--c) 11%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--c) 25%, transparent);
      white-space: nowrap; overflow: hidden;
    }
    .commentaire .c-titre small { color: var(--texte-3); font-size: 11px; }

    /* ─── Fils ─── */
    .fils path { fill: none; }
    .fil-exec { stroke: #8b8b93; stroke-width: 2.4; transition: stroke 0.3s, stroke-width 0.3s; }
    .fil-exec.f-termine { stroke: #b4b4ba; stroke-width: 2.2; }
    .fil-exec.f-attend { stroke: #52525b; stroke-width: 2.6; }
    .fil-exec.f-vivant { stroke: #18181b; stroke-width: 3.4; }
    .fil-exec.f-en_file { stroke: #c4c4c8; stroke-width: 2; stroke-dasharray: 6 5; }
    .fil-exec.f-echec { stroke: var(--echec); stroke-width: 2.4; }
    .fil-exec.f-chemin { stroke: var(--choix); }
    .fil-donnee { stroke: var(--t-texte); stroke-width: 1.4; stroke-opacity: 0.6; }
    .fil-donnee.f-termine, .fil-donnee.f-echec { stroke-opacity: 0.28; }
    .fil-donnee.f-en_file { stroke-opacity: 0.3; stroke-dasharray: 3 4; }
    .impulsion { fill: #18181b; stroke: #fff; stroke-width: 1.5; }

    /* ─── Nœuds ─── */
    .noeud {
      position: absolute; left: 0; top: 0; cursor: pointer;
      background: #fff; border: 1px solid #d4d4d8; border-radius: 7px;
      box-shadow: 0 1px 2px rgba(24, 24, 27, 0.06), 0 6px 16px -10px rgba(24, 24, 27, 0.25);
      transition: opacity 0.35s, border-color 0.3s;
    }
    .noeud:hover { border-color: #a1a1aa; }
    .tete {
      height: 42px; display: flex; align-items: center; gap: 9px; padding: 0 10px 0 9px;
      background: var(--c); color: #fff; border-radius: 6px 6px 0 0;
      transition: background-color 0.3s;
    }
    .ico {
      flex: none; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 4px;
      font: 600 13px/1 var(--police); background: rgba(255, 255, 255, 0.18);
    }
    .tt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .tt b { font: 600 12.5px/1.2 var(--police); letter-spacing: -0.005em; }
    .tt span { font: 11px/1.25 var(--police); opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chrono { flex: none; font: 500 10.5px var(--mono); opacity: 0.85; }

    .corps { display: grid; grid-template-columns: 132px 1fr; padding: 6px 0; }
    .col { display: flex; flex-direction: column; min-width: 0; }
    .rang {
      height: 22px; display: flex; align-items: center; gap: 6px; min-width: 0;
      font: 11.5px var(--police); color: var(--texte-2); white-space: nowrap;
    }
    .col.g .rang { padding-left: 4px; }
    .col.d .rang { flex-direction: row-reverse; padding-right: 4px; }
    .rang .lab { flex: none; }
    .rang .val { min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 500 10.5px var(--mono); color: var(--texte); }
    .col.d .rang .val { text-align: right; }
    .rang .champ {
      min-width: 0; overflow: hidden; text-overflow: ellipsis; padding: 1px 5px; border-radius: 3px;
      font: 10px var(--mono); color: var(--texte); background: #f4f4f2; border: 1px solid #e4e4e0;
    }
    .rang.exec .lab { color: var(--texte); font-weight: 500; }
    .rang.bouton { cursor: pointer; }
    .rang.bouton .lab { color: var(--choix); font-weight: 500; }
    .rang.bouton:hover .lab { text-decoration: underline; }

    /* Broches */
    .pin { flex: none; width: 12px; height: 12px; display: grid; place-items: center; }
    .pin svg { display: block; overflow: visible; }
    .pin.exec path { fill: #fff; stroke: var(--exec); stroke-width: 1.4; stroke-linejoin: round; }
    .pin.exec.plein path { fill: var(--exec); }
    .pin.donnee i { width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--tc); background: #fff; }
    .pin.donnee.plein i { background: var(--tc); }
    .pin.action { font: 600 11px/1 var(--police); color: var(--choix); }
    .t-texte { --tc: var(--t-texte); }
    .t-entier { --tc: var(--t-entier); }
    .t-reel { --tc: var(--t-reel); }

    .pied {
      height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 10px; margin-top: -2px;
      border-top: 1px solid #efefec; font: 10.5px var(--mono); color: var(--texte-2);
      white-space: nowrap; overflow: hidden; border-radius: 0 0 6px 6px;
    }
    .pied .etiq { flex: none; padding: 0 5px; border-radius: 3px; font-size: 10px; line-height: 16px; color: var(--texte); background: #f0f0ed; border: 1px solid #e3e3df; }
    .pied .txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

    .badge {
      position: absolute; right: 10px; top: -10px; display: none; padding: 2px 7px; border-radius: 3px;
      font: 600 10px/14px var(--police); letter-spacing: 0.04em; text-transform: uppercase;
      color: #fff; background: var(--echec); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    /* États */
    .noeud.vivant { border-color: #52525b; }
    .noeud.vivant .pied { color: var(--texte); }
    .noeud.e-en_file { opacity: 0.78; border-style: dashed; border-color: #b8b8be; }
    .noeud.e-en_file .tete { background: #a1a1aa; }
    .noeud.e-en_file .corps, .noeud.e-en_file .pied {
      background-image: repeating-linear-gradient(135deg, transparent 0 6px, rgba(24, 24, 27, 0.045) 6px 7px);
    }
    .noeud.e-en_file .pied { color: var(--texte-3); }
    .noeud.e-termine { opacity: 0.62; }
    .noeud.e-termine:hover { opacity: 0.9; }
    .noeud.e-echec { border-color: var(--echec); }
    .noeud.e-echec .tete { background: var(--echec); }
    .noeud.e-echec .badge { display: block; }
    .noeud.e-echec .rang .val.v-resultat { color: var(--echec); }
    .noeud.choisi { opacity: 1; outline: 2px solid var(--choix); outline-offset: 2px; }

    /* Nœud événement */
    .noeud.evenement { border-radius: 10px; }
    .noeud.evenement .tete { border-radius: 9px 9px 0 0; background: #334155; }
    .question { padding: 2px 12px 10px; font: 12px/1.45 var(--police); color: var(--texte-2); white-space: normal; }

    /* ─── Panneau Détails ─── */
    .details {
      position: absolute; top: 0; right: 0; bottom: 0; width: 340px; z-index: 10;
      display: flex; flex-direction: column; cursor: default; user-select: text;
      background: #fff; border-left: 1px solid var(--trait-fort);
      box-shadow: -8px 0 24px -18px rgba(0, 0, 0, 0.35);
      transform: translateX(calc(100% + 12px)); transition: transform 0.25s ease-out;
    }
    .details.ouvert { transform: none; }
    .d-onglet {
      flex: none; height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px;
      font: 600 12px var(--police); color: var(--texte); background: #f4f4f2; border-bottom: 1px solid var(--trait);
    }
    .d-onglet span { flex: 1; }
    .d-fermer {
      width: 24px; height: 24px; padding: 0; border: 0; border-radius: 4px; cursor: pointer;
      background: transparent; color: var(--texte-2); font-size: 17px; line-height: 1;
    }
    .d-fermer:hover { background: #e9e9e6; color: var(--texte); }
    .d-tete { flex: none; display: flex; gap: 10px; padding: 12px 12px 12px; border-bottom: 1px solid var(--trait); }
    .d-ico { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 5px; color: #fff; background: var(--c); font: 600 15px var(--police); }
    .d-tete div { min-width: 0; }
    .d-role { font: 500 11px var(--police); color: var(--texte-3); }
    .d-titre { margin: 2px 0 0; font: 600 14px/1.35 var(--police); color: var(--texte); }
    .d-defil { flex: 1; min-height: 0; overflow-y: auto; }
    .details details { border-bottom: 1px solid var(--trait); }
    .details summary {
      list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px;
      font: 600 11.5px var(--police); color: var(--texte); background: #fafaf8; border-bottom: 1px solid var(--trait);
    }
    .details summary::-webkit-details-marker { display: none; }
    .details summary::before { content: '▸'; width: 10px; font-size: 10px; color: var(--texte-2); }
    .details details[open] summary::before { content: '▾'; }
    .details summary small { margin-left: auto; font: 10.5px var(--mono); color: var(--texte-3); font-weight: 400; }
    .props { margin: 0; padding: 4px 0; }
    .props div { display: grid; grid-template-columns: 104px 1fr; gap: 8px; padding: 4px 12px; font-size: 12px; }
    .props dt { color: var(--texte-2); }
    .props dd { margin: 0; min-width: 0; color: var(--texte); overflow-wrap: anywhere; }
    .props dd.mono { font: 11.5px var(--mono); }
    .props dd.lien { color: var(--choix); cursor: pointer; }
    .props dd.lien:hover { text-decoration: underline; }
    .props dd .pt { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; border: 2px solid var(--tc); vertical-align: -1px; }
    .props dd.echec { color: var(--echec); }
    .journal { margin: 0; padding: 4px 0 8px; list-style: none; font: 11px/1.45 var(--mono); }
    .journal li { display: grid; grid-template-columns: 42px 1fr; gap: 8px; padding: 3px 12px; }
    .journal li:nth-child(odd) { background: #fafaf8; }
    .journal time { color: var(--texte-3); }
    .journal span { color: var(--texte-2); overflow-wrap: anywhere; }
    .journal li[data-t='demarre'] span, .journal li[data-t='lance'] span { color: var(--texte); }
    .journal li[data-t='termine'] span { color: var(--ok); }
    .journal li[data-t='echec'] span { color: var(--echec); }

    /* ─── Légende et recadrage ─── */
    .legende-bp {
      position: absolute; left: 12px; bottom: 12px; z-index: 5; cursor: default;
      display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 7px 12px;
      font-size: 11.5px; color: var(--texte-2); background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--trait); border-radius: 6px;
    }
    .legende-bp span { display: inline-flex; align-items: center; gap: 6px; }
    .legende-bp .l-exec { width: 22px; height: 3px; background: #8b8b93; }
    .legende-bp .l-actif { width: 22px; height: 3px; background: #18181b; }
    .legende-bp .l-donnee { width: 22px; height: 0; border-top: 1.5px solid var(--t-texte); }
    .legende-bp .pin.donnee i { width: 8px; height: 8px; }
    .legende-bp .aide { color: var(--texte-3); }
    .recadrer {
      position: absolute; right: 12px; bottom: 12px; z-index: 6; padding: 6px 12px; cursor: pointer; display: none;
      font: 500 12px var(--police); color: var(--texte); background: #fff;
      border: 1px solid var(--trait-fort); border-radius: 6px;
    }
    .recadrer.visible { display: block; }
    .recadrer:hover { background: #f4f4f2; }
    .scene.panneau .recadrer { right: 352px; }
  </style>
</head>
<body>
  <main class="scene"></main>
  <script type="module" src="./vue.js"></script>
</body>
</html>
