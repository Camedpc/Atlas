<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piles de démonstration · Atlas</title>
  <link rel="stylesheet" href="../../commun/commun.css">
  <link rel="stylesheet" href="../../commun/clair.css">
  <style>
    :root {
      --papier: #fafaf8;
      --grille-fine: #efefeb;
      --grille-majeure: #e0e0db;
      --onglets: 34px;
      --details: 340px;
      --choix: #2563eb;
      --champ: #f6f6f3;
      --champ-trait: #e2e2dd;
    }
    [hidden] { display: none !important; }
    body { overflow: hidden; }

    /* ─── Barre et onglets ─── */
    .barre button:disabled { opacity: 0.4; cursor: default; background: transparent; }
    .barre .discret { color: var(--texte-3); }
    .onglets {
      position: fixed; top: var(--barre); left: 0; right: 0; height: var(--onglets); z-index: 90;
      display: flex; align-items: flex-end; gap: 2px; padding: 0 12px;
      background: #efefec; border-bottom: 1px solid var(--trait-fort);
    }
    .onglets button {
      height: 28px; margin-bottom: -1px; padding: 0 14px; cursor: pointer;
      font: 500 12px var(--police); color: var(--texte-2);
      background: transparent; border: 1px solid transparent; border-bottom: 0; border-radius: 5px 5px 0 0;
    }
    .onglets button:hover { color: var(--texte); }
    .onglets button.actif { color: var(--texte); background: var(--papier); border-color: var(--trait-fort); }
    .onglets button small { margin-left: 5px; font: 10.5px var(--mono); color: var(--texte-3); }
    .onglets .compteurs { margin-left: auto; align-self: center; display: flex; gap: 12px; font: 11.5px var(--police); color: var(--texte-2); }
    .onglets .compteurs b { font: 500 11.5px var(--mono); color: var(--texte); margin-left: 3px; }

    .ecran { position: fixed; inset: calc(var(--barre) + var(--onglets)) 0 0 0; display: flex; }

    /* ─── Canevas ─── */
    .canevas {
      position: relative; flex: 1; min-width: 0; overflow: hidden; user-select: none; cursor: default;
      background-color: var(--papier);
      background-image:
        linear-gradient(var(--grille-majeure) 1px, transparent 1px),
        linear-gradient(90deg, var(--grille-majeure) 1px, transparent 1px),
        linear-gradient(var(--grille-fine) 1px, transparent 1px),
        linear-gradient(90deg, var(--grille-fine) 1px, transparent 1px);
    }
    .canevas.glisse, .canevas.glisse * { cursor: grabbing !important; }
    .canevas.liaison, .canevas.liaison * { cursor: crosshair !important; }
    .monde { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    .commentaires, .noeuds { position: absolute; left: 0; top: 0; }
    .fils { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }

    /* Fils : une prémisse → la ligne du module qui l'utilise ; couleur = validité de la démonstration */
    .fil { fill: none; stroke-width: 2; stroke-opacity: 0.7; pointer-events: none; }
    .fil.v-valide { stroke: #3f3f46; }
    .fil.v-a_verifier { stroke: #2563eb; }
    .fil.v-invalide { stroke: #dc2626; }
    .fil.inactif { stroke: #a1a1aa; stroke-opacity: 0.6; stroke-dasharray: 5 5; }
    .fil.lie { stroke-width: 3; stroke-opacity: 1; }
    .fil-zone { fill: none; stroke: transparent; stroke-width: 12; pointer-events: stroke; cursor: pointer; }
    .fil-zone:hover + .fil { stroke-width: 3; stroke-opacity: 1; }
    .apercu { fill: none; stroke: #18181b; stroke-width: 2; stroke-dasharray: 6 4; pointer-events: none; }

    /* ─── Boîtes « Comment » ─── */
    .commentaire {
      position: absolute; left: 0; top: 0; border-radius: 4px; pointer-events: none;
      background: color-mix(in srgb, var(--c) 5%, transparent);
      border: 1px solid color-mix(in srgb, var(--c) 35%, transparent);
    }
    .commentaire.choisi { border-color: var(--choix); box-shadow: 0 0 0 1px var(--choix); }
    .c-titre {
      pointer-events: auto; cursor: move; height: 38px; padding: 0 14px; display: flex; align-items: center;
      font: 600 16px var(--police); letter-spacing: -0.01em; color: color-mix(in srgb, var(--c) 82%, #000);
      background: color-mix(in srgb, var(--c) 11%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--c) 22%, transparent);
      border-radius: 3px 3px 0 0; white-space: nowrap; overflow: hidden;
    }
    .c-nom { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .c-coin {
      pointer-events: auto; position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize;
      background: linear-gradient(135deg, transparent 55%, color-mix(in srgb, var(--c) 45%, transparent) 55%);
      border-radius: 0 0 3px 0;
    }

    /* ─── Nœuds ─── */
    .noeud {
      position: absolute; left: 0; top: 0; background: #fff; border: 1px solid #d4d4d8; border-radius: 6px;
      box-shadow: 0 1px 2px rgba(24, 24, 27, 0.06), 0 6px 16px -10px rgba(24, 24, 27, 0.25);
    }
    .noeud.choisi { outline: 2px solid var(--choix); outline-offset: 2px; }
    .n-tete {
      height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; cursor: move;
      background: #f3f3f0; border-bottom: 1px solid #e4e4e0; border-radius: 5px 5px 0 0;
    }
    .n-nom {
      flex: 1; min-width: 0; font: 600 13px var(--police); letter-spacing: -0.005em; color: var(--texte);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .edition {
      overflow: visible; text-overflow: clip; cursor: text; user-select: text; outline: 1px solid var(--choix);
      background: #fff; border-radius: 2px; padding: 0 3px; margin: 0 -3px; color: var(--texte);
    }
    .puce {
      flex: none; display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 10px;
      font: 500 11px var(--police); color: color-mix(in srgb, var(--s) 82%, #000);
      background: color-mix(in srgb, var(--s) 9%, #fff); border: 1px solid color-mix(in srgb, var(--s) 26%, #fff);
    }
    .puce i, .pt { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--s); }

    .broche {
      flex: none; width: 12px; height: 12px; border-radius: 50%; cursor: crosshair;
      border: 2px solid #71717a; background: #fff;
    }
    .broche.pleine { background: #71717a; }
    .broche:hover { border-color: #18181b; }

    /* Pile (assertion démontrée) */
    .pile { width: 300px; }
    .sec + .sec { border-top: 1px solid #ecece8; }
    .s-tete {
      height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 8px; cursor: pointer;
      font: 600 11px var(--police); letter-spacing: 0.02em; color: var(--texte-2); background: #fafaf8;
    }
    .s-tete:hover { color: var(--texte); }
    .s-tete small { font: 10.5px var(--mono); color: var(--texte-3); font-weight: 400; }
    .caret { width: 10px; font-size: 9px; color: var(--texte-3); text-align: center; }
    .caret::before { content: '▼'; }
    .sec.replie .caret::before { content: '▶'; }
    .s-plus {
      margin-left: auto; width: 20px; height: 18px; padding: 0; cursor: pointer; border-radius: 4px;
      font: 500 13px/1 var(--police); color: var(--texte-2); background: #fff; border: 1px solid #e0e0db;
    }
    .s-plus:hover { color: var(--texte); border-color: #b8b8b2; }
    .s-corps { padding: 6px; }
    .enonce { padding: 0 4px 2px; font: 12px/1.45 var(--police); color: var(--texte-2); }
    .vide { padding: 3px 4px; font: italic 11.5px var(--police); color: var(--texte-3); }

    /* Modules de démonstration (comme les modules d'une pile Niagara) */
    .module { border: 1px solid #e2e2de; border-radius: 4px; background: #fff; }
    .module + .module { margin-top: 6px; }
    .m-tete {
      height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 3px;
      background: #f6f6f3; border-bottom: 1px solid #ebebe7; border-radius: 3px 3px 0 0;
    }
    .m-poignee { flex: none; width: 12px; text-align: center; cursor: grab; color: #a1a1aa; font-size: 11px; letter-spacing: -1px; }
    .m-poignee:hover { color: var(--texte); }
    .m-actif { flex: none; margin: 0; width: 13px; height: 13px; accent-color: #3f3f46; cursor: pointer; }
    .m-nom { flex: 1; min-width: 0; font: 500 11.5px var(--mono); color: var(--texte); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .m-valid { flex: none; display: inline-flex; align-items: center; gap: 4px; font: 500 10.5px var(--police); color: var(--v); }
    .m-valid i { width: 6px; height: 6px; border-radius: 50%; background: var(--v); }
    .m-conf { flex: none; min-width: 30px; text-align: right; font: 500 10.5px var(--mono); color: var(--texte-2); }
    .m-rang { height: 23px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 3px; font: 11.5px var(--police); }
    .m-rang + .m-rang { border-top: 1px solid #f3f3f0; }
    .m-lab { flex: none; width: 62px; font-size: 11px; color: var(--texte-3); }
    .m-val {
      flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      padding: 1px 6px; border-radius: 3px; font: 10.5px var(--mono); color: var(--texte);
      background: var(--champ); border: 1px solid var(--champ-trait);
    }
    .m-rang .pt { margin-left: auto; }
    .m-rang.ajout .m-val { background: transparent; border-color: transparent; padding-left: 0; font: italic 11px var(--police); color: var(--texte-3); }
    .m-texte {
      padding: 4px 8px 6px 23px; font: 11px/1.4 var(--police); color: var(--texte-2); border-top: 1px solid #f3f3f0;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .module.inactif > :not(.m-tete), .module.inactif .m-tete > :not(.m-actif) { opacity: 0.42; }
    .module.inactif .m-tete { background: repeating-linear-gradient(135deg, #f6f6f3 0 6px, #efefec 6px 7px); }
    .module.souleve { position: relative; z-index: 3; box-shadow: 0 8px 18px -8px rgba(24, 24, 27, 0.35); }
    .insertion { position: absolute; left: 6px; right: 6px; height: 2px; border-radius: 1px; background: var(--choix); display: none; }
    .canevas.liaison .module:hover, .canevas.liaison .pile:hover .n-tete { background-color: #eef3fd; }

    .u-rang {
      display: flex; align-items: center; gap: 6px; height: 23px; padding: 0 4px; border-radius: 3px;
      font: 11.5px var(--police); color: var(--texte); cursor: pointer;
    }
    .u-rang:hover { background: #f3f3f0; }
    .u-rang .fl { color: var(--texte-3); }
    .u-rang span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .u-rang small { margin-left: auto; flex: none; font: 10.5px var(--mono); color: var(--texte-3); }
    .u-rang.inactif { opacity: 0.5; }

    /* Paramètre (fait admis) */
    .param { width: 232px; border-radius: 7px; }
    .param .n-tete { height: 32px; padding: 0 8px; background: #fff; border-bottom: 0; border-radius: 6px 6px 0 0; }
    .param .n-nom { font-size: 12.5px; }
    .param .broche { border-color: var(--t); }
    .param .broche.pleine { background: var(--t); }
    .type { flex: none; display: inline-flex; align-items: center; gap: 5px; font: 500 10.5px var(--mono); color: color-mix(in srgb, var(--t) 78%, #000); }
    .type i { width: 10px; height: 10px; border-radius: 3px; background: var(--t); }
    .pa-val {
      margin: 0 8px 8px; padding: 4px 7px; border-radius: 3px; font: 10.5px/1.45 var(--mono); color: var(--texte-2);
      background: var(--champ); border: 1px solid var(--champ-trait);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* ─── Surcouches ─── */
    .ariane, .zoom, .legende-p {
      position: absolute; z-index: 5; background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--trait); border-radius: 6px; font-size: 12px; color: var(--texte-2);
    }
    .ariane {
      left: 12px; top: 10px; max-width: calc(100% - 140px); padding: 6px 10px; pointer-events: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ariane b { color: var(--texte); font-weight: 600; }
    .ariane .sep { margin: 0 6px; color: var(--texte-3); }
    .zoom { right: 12px; top: 10px; padding: 6px 10px; font: 11.5px var(--mono); pointer-events: none; }
    .legende-p {
      left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
      max-width: calc(100% - 24px); padding: 7px 12px; font-size: 11.5px;
    }
    .legende-p span { display: inline-flex; align-items: center; gap: 6px; }
    .legende-p .l { width: 22px; height: 0; border-top: 2px solid; }
    .legende-p .aide { color: var(--texte-3); }
    .rectangle-sel { position: absolute; z-index: 4; display: none; pointer-events: none; border: 1px solid var(--choix); background: rgba(37, 99, 235, 0.06); }

    /* ─── Menu « Toutes les actions » ─── */
    .menu {
      position: fixed; z-index: 200; width: 310px; max-height: 420px; display: flex; flex-direction: column;
      background: #fff; border: 1px solid var(--trait-fort); border-radius: 6px;
      box-shadow: 0 12px 32px -14px rgba(24, 24, 27, 0.35); font-size: 12.5px;
    }
    .mn-titre { padding: 8px 10px 6px; font: 600 11.5px var(--police); color: var(--texte); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mn-recherche {
      margin: 0 8px 6px; height: 28px; padding: 0 8px; outline: none; font: 12.5px var(--police); color: var(--texte);
      border: 1px solid var(--trait-fort); border-radius: 4px; background: #fff;
    }
    .mn-recherche:focus { border-color: var(--choix); }
    .mn-liste { overflow-y: auto; padding-bottom: 6px; border-top: 1px solid var(--trait); }
    .mn-groupe { padding: 7px 10px 3px; font: 600 10.5px var(--police); letter-spacing: 0.05em; text-transform: uppercase; color: var(--texte-3); }
    .mn-item { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 18px; cursor: pointer; color: var(--texte); }
    .mn-item span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mn-item small { margin-left: auto; flex: none; font: 10.5px var(--mono); color: var(--texte-3); }
    .mn-item.actif { background: #e8effd; }
    .mn-vide { padding: 10px; color: var(--texte-3); }

    /* ─── Panneau Détails ─── */
    .details {
      flex: none; width: var(--details); min-height: 0; display: flex; flex-direction: column;
      background: #fff; border-left: 1px solid var(--trait-fort);
    }
    .d-onglet {
      flex: none; height: 32px; display: flex; align-items: center; padding: 0 12px;
      font: 600 12px var(--police); color: var(--texte); background: #f4f4f2; border-bottom: 1px solid var(--trait);
    }
    .d-defil { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 16px; }
    .d-tete { display: flex; gap: 10px; align-items: center; padding: 12px; border-bottom: 1px solid var(--trait); }
    .d-tete .d-genre { font: 500 11px var(--police); color: var(--texte-3); }
    .d-tete h2 { margin: 2px 0 0; font: 600 14px/1.35 var(--police); color: var(--texte); }
    .d-tete > div { min-width: 0; flex: 1; }
    .details details { border-bottom: 1px solid var(--trait); }
    .details summary {
      list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 12px;
      font: 600 11.5px var(--police); color: var(--texte); background: #fafaf8; border-bottom: 1px solid var(--trait);
    }
    .details summary::-webkit-details-marker { display: none; }
    .details summary::before { content: '▸'; width: 10px; font-size: 10px; color: var(--texte-2); }
    .details details[open] summary::before { content: '▾'; }
    .details summary small { font: 10.5px var(--mono); color: var(--texte-3); font-weight: 400; }
    .details summary .btn { margin-left: auto; }
    .champ { display: grid; grid-template-columns: 88px 1fr; gap: 8px; align-items: start; padding: 4px 12px; }
    .champ > label, .champ > .lab { padding-top: 5px; font-size: 12px; color: var(--texte-2); }
    .champ > .val { padding-top: 4px; display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .champ small { color: var(--texte-3); font-size: 11px; }
    .details input:not([type='checkbox']), .details textarea, .details select, .pg input, .pg select {
      width: 100%; padding: 4px 6px; font: 12px var(--police); color: var(--texte);
      background: #fff; border: 1px solid #dcdcd7; border-radius: 4px; outline: none;
    }
    .details textarea { resize: vertical; line-height: 1.45; }
    .details input:focus, .details textarea:focus, .details select:focus, .pg input:focus, .pg select:focus { border-color: var(--choix); }
    .details .mono { font-family: var(--mono); font-size: 11.5px; }
    .d-bloc { padding: 8px 0; }
    .d-module { margin: 8px 10px; border: 1px solid #e2e2de; border-radius: 5px; }
    .d-module.inactif { background: repeating-linear-gradient(135deg, #fff 0 6px, #f7f7f5 6px 7px); }
    .d-module-tete { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 8px; background: #f6f6f3; border-bottom: 1px solid #ebebe7; border-radius: 4px 4px 0 0; }
    .d-module-tete input[type='text'] { flex: 1; font-family: var(--mono) !important; font-size: 11.5px !important; }
    .d-module .champ { grid-template-columns: 78px 1fr; padding: 3px 8px; }
    .d-module .champ:first-of-type { padding-top: 6px; }
    .prem { display: flex; align-items: center; gap: 6px; min-height: 24px; font-size: 12px; }
    .prem .lien { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lien { color: var(--choix); cursor: pointer; }
    .lien:hover { text-decoration: underline; }
    .btn {
      flex: none; padding: 4px 9px; cursor: pointer; font: 500 11.5px var(--police); color: var(--texte);
      background: #fff; border: 1px solid var(--trait-fort); border-radius: 4px;
    }
    .btn:hover { background: #f4f4f2; }
    .btn.danger { color: var(--echec); }
    .btn-x { flex: none; width: 20px; height: 20px; padding: 0; cursor: pointer; border: 0; border-radius: 3px; background: transparent; color: var(--texte-3); font-size: 14px; line-height: 1; }
    .btn-x:hover { background: #efefec; color: var(--texte); }
    .d-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; }
    .nuancier { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 3px; }
    .nuancier button { width: 20px; height: 20px; padding: 0; cursor: pointer; border-radius: 4px; border: 1px solid rgba(0, 0, 0, 0.12); background: var(--c); }
    .nuancier button.actif { outline: 2px solid var(--texte); outline-offset: 1px; }
    .liste-simple { margin: 0; padding: 4px 12px 8px; list-style: none; font-size: 12px; }
    .liste-simple li { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
    .liste-simple li small { margin-left: auto; font: 10.5px var(--mono); color: var(--texte-3); }
    .raccourcis { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 8px 12px 12px; margin: 0; font-size: 12px; }
    .raccourcis dt { font: 11px var(--mono); color: var(--texte); }
    .raccourcis dd { margin: 0; color: var(--texte-2); }
    .note { padding: 6px 12px; font-size: 11.5px; color: var(--texte-3); }

    /* ─── Pages Paramètres et Journal ─── */
    .page { flex: 1; min-width: 0; overflow: auto; background: var(--papier); }
    .pg { max-width: 1180px; margin: 0 auto; padding: 24px 28px 40px; }
    .pg-tete { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 16px; }
    .pg-tete div { flex: 1; }
    .pg h1 { margin: 0; font: 600 18px var(--police); letter-spacing: -0.01em; }
    .pg p { margin: 4px 0 0; color: var(--texte-2); font-size: 12.5px; }
    .tab { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--trait); border-radius: 6px; }
    .tab th { text-align: left; padding: 8px 10px; font: 600 10.5px var(--police); letter-spacing: 0.05em; text-transform: uppercase; color: var(--texte-3); background: #f7f7f5; border-bottom: 1px solid var(--trait); }
    .tab td { padding: 6px 10px; border-bottom: 1px solid #f0f0ed; vertical-align: middle; font-size: 12px; }
    .tab tr:last-child td { border-bottom: 0; }
    .tab .type-cel { display: flex; align-items: center; gap: 8px; }
    .tab .type-cel i { flex: none; width: 10px; height: 10px; border-radius: 3px; background: var(--t); }
    .tab .usages { color: var(--texte-2); }
    .tab .actions { white-space: nowrap; text-align: right; }
    .tab .actions .btn + .btn { margin-left: 6px; }
    .tab input, .tab select { border-color: transparent !important; background: transparent !important; }
    .tab input:hover, .tab select:hover { border-color: #dcdcd7 !important; }
    .tab input:focus, .tab select:focus { border-color: var(--choix) !important; background: #fff !important; }
    .journal { margin: 0; padding: 0; list-style: none; background: #fff; border: 1px solid var(--trait); border-radius: 6px; font: 12px/1.5 var(--police); }

    .journal .vide-j { display: block; color: var(--texte-3); }
  </style>
</head>
