<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graphe de logique · Blueprint B</title>
  <link rel="stylesheet" href="../../commun/commun.css">
  <link rel="stylesheet" href="../../commun/clair.css">
  <style>
    :root {
      --papier: #fafaf8;
      --grille-fine: #efefeb;
      --grille-majeure: #e0e0db;
      --choix: #d97706;
      --panneau: 320px;
      --bord-noeud: #d4d4d8;
    }

    /* ─── Barre d'outils ─── */
    .barre .probleme {
      min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis;
      font-size: 12.5px; color: var(--texte-2); padding-left: 14px; border-left: 1px solid var(--trait);
    }
    .barre .probleme b { color: var(--texte-3); font-weight: 500; margin-right: 6px; }
    .barre .espace { min-width: 12px; }
    .barre button:disabled { opacity: 0.4; cursor: default; background: transparent; }
    .barre kbd { font: 10px var(--mono); color: var(--texte-3); margin-left: 5px; }
    @media (max-width: 1200px) { .barre kbd { display: none; } }
    @media (max-width: 1000px) { .barre .probleme { display: none; } }

    /* ─── Toile (papier millimétré) ─── */
    .toile {
      position: absolute; inset: 0 var(--panneau) 0 0; overflow: hidden; user-select: none; outline: none;
      background-color: var(--papier);
      background-image:
        linear-gradient(var(--grille-majeure) 1px, transparent 1px),
        linear-gradient(90deg, var(--grille-majeure) 1px, transparent 1px),
        linear-gradient(var(--grille-fine) 1px, transparent 1px),
        linear-gradient(90deg, var(--grille-fine) 1px, transparent 1px);
      background-size: 128px 128px, 128px 128px, 16px 16px, 16px 16px;
    }
    .toile.panoramique, .toile.panoramique * { cursor: grabbing !important; }
    .toile.relie, .toile.relie * { cursor: crosshair !important; }
    .monde { position: absolute; left: 0; top: 0; transform-origin: 0 0; --ec: 1; }
    .couche { position: absolute; left: 0; top: 0; }
    .fils { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; }
    .filigrane {
      position: absolute; right: 18px; bottom: 44px; pointer-events: none;
      font: 700 30px/1 var(--police); letter-spacing: 0.06em; color: #e2e2dd;
    }
    .zoom { position: absolute; right: 18px; top: 12px; font: 500 12px var(--mono); color: var(--texte-3); pointer-events: none; }
    .marquee { position: absolute; display: none; border: 1px solid #a16207; background: rgba(217, 119, 6, 0.06); pointer-events: none; }

    /* ─── Boîtes « Comment » (catégories) ─── */
    .commentaire {
      position: absolute; left: 0; top: 0; border-radius: 4px; pointer-events: none;
      background: color-mix(in srgb, var(--c) 6%, transparent);
      border: 1px solid color-mix(in srgb, var(--c) 36%, transparent);
    }
    .commentaire.choisi { outline: 2px solid var(--choix); outline-offset: 1px; }
    .c-titre {
      pointer-events: auto; cursor: move; height: 34px; padding: 0 12px; display: flex; align-items: center;
      background: color-mix(in srgb, var(--c) 13%, #fff);
      border-bottom: 1px solid color-mix(in srgb, var(--c) 24%, transparent); border-radius: 3px 3px 0 0;
      overflow: hidden;
    }
    .c-nom {
      font: 600 calc(14px * var(--ec)) / 1 var(--police); letter-spacing: -0.005em; white-space: nowrap;
      color: color-mix(in srgb, var(--c) 80%, #000); outline: none; min-width: 20px;
    }
    .poignee { position: absolute; pointer-events: auto; }
    .poignee[data-dir='n'] { left: 8px; right: 8px; top: -4px; height: 8px; cursor: ns-resize; }
    .poignee[data-dir='s'] { left: 8px; right: 8px; bottom: -4px; height: 8px; cursor: ns-resize; }
    .poignee[data-dir='e'] { top: 8px; bottom: 8px; right: -4px; width: 8px; cursor: ew-resize; }
    .poignee[data-dir='w'] { top: 8px; bottom: 8px; left: -4px; width: 8px; cursor: ew-resize; }
    .poignee[data-dir='nw'] { left: -5px; top: -5px; width: 12px; height: 12px; cursor: nwse-resize; }
    .poignee[data-dir='ne'] { right: -5px; top: -5px; width: 12px; height: 12px; cursor: nesw-resize; }
    .poignee[data-dir='sw'] { left: -5px; bottom: -5px; width: 12px; height: 12px; cursor: nesw-resize; }
    .poignee[data-dir='se'] {
      right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize;
      background: linear-gradient(135deg, transparent 0 55%, color-mix(in srgb, var(--c) 45%, transparent) 55% 62%, transparent 62% 72%, color-mix(in srgb, var(--c) 45%, transparent) 72% 79%, transparent 79%);
    }

    /* ─── Fils ─── */
    .fils path { fill: none; }
    .fil { stroke-linecap: round; stroke-opacity: 0.85; }
    .fil.v-valide { stroke: #3f7a4c; }
    .fil.v-a_verifier { stroke: #2563eb; stroke-dasharray: 7 5; }
    .fil.v-invalide { stroke: #dc2626; stroke-dasharray: 2 5; }
    .fils.focalise .fil { stroke-opacity: 0.28; }
    .fils.focalise .fil.actif { stroke-opacity: 1; }
    .fil.choisi { stroke-opacity: 1 !important; filter: drop-shadow(0 0 0.5px #000); }
    .fil-zone { stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
    .fil-zone:hover + .fil, .fil.survol { stroke-opacity: 1; }
    .fil-temp { stroke: #3f3f46; stroke-width: 2; stroke-dasharray: 5 4; }

    /* ─── Nœuds ─── */
    .noeud {
      position: absolute; left: 0; top: 0; width: 272px; cursor: default;
      background: #fff; border: 1px solid var(--bord-noeud); border-radius: 7px;
      box-shadow: 0 1px 2px rgba(24, 24, 27, 0.06), 0 6px 16px -10px rgba(24, 24, 27, 0.25);
    }
    .noeud:hover { border-color: #a1a1aa; }
    .noeud.choisi { outline: 2px solid var(--choix); outline-offset: 2px; }
    .noeud.st-invalide { border-color: #f0a3a3; }
    .tete {
      height: 40px; display: flex; align-items: center; gap: 9px; padding: 0 10px 0 9px; cursor: move;
      background: var(--c); color: #fff; border-radius: 6px 6px 0 0;
    }
    .ico {
      flex: none; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 4px;
      font: 600 13px/1 var(--police); background: rgba(255, 255, 255, 0.18);
    }
    .tt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .nom { font: 600 12.5px/1.25 var(--police); letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; outline: none; }
    .tt > span { font: 10.5px/1.2 var(--police); opacity: 0.82; }
    [contenteditable='plaintext-only'], [contenteditable='true'] {
      cursor: text; user-select: text; overflow: visible; text-overflow: clip;
      background: #fff; color: var(--texte); border-radius: 3px; box-shadow: 0 0 0 1px var(--choix); padding: 0 3px;
    }

    .corps { padding: 5px 0 4px; }
    .rang {
      height: 22px; display: flex; align-items: center; gap: 7px; padding: 0 10px 0 5px; min-width: 0;
      font: 11.5px var(--police); color: var(--texte-2); white-space: nowrap;
    }
    .rang .lab { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .rang.droite { justify-content: flex-end; padding: 0 5px 0 10px; }
    .rang.droite .lab { color: var(--texte); font-weight: 500; }
    .rang.fantome .lab { color: var(--texte-3); font-size: 11px; }
    .rang.fantome .pin { opacity: 0.75; }

    /* Broches : sortie = statut du nœud ; entrées = validité de la démonstration */
    .pin { flex: none; width: 14px; height: 14px; display: grid; place-items: center; cursor: crosshair; border-radius: 50%; }
    .pin::after { content: ''; width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--p, #71717a); background: #fff; }
    .pin.plein::after { background: var(--p); }
    .pin.vide::after { width: 7px; height: 7px; border-width: 1.5px; border-style: dashed; }
    .pin:hover::after, .pin.cible::after { box-shadow: 0 0 0 3px color-mix(in srgb, var(--p, #71717a) 25%, transparent); }
    .pin.cible::after { background: var(--p, #71717a); }

    .demo { margin: 3px 0 0; padding: 2px 0 1px; border-top: 1px solid #f0f0ed; }
    .demo.choisie { background: #fdf6ea; }
    .demo-tete {
      height: 22px; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 26px; cursor: pointer;
      font: 10.5px var(--mono); color: var(--texte-2);
    }
    .demo-tete:hover .demo-nom { color: var(--texte); text-decoration: underline; }
    .demo-nom { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; outline: none; }
    .val {
      flex: none; padding: 0 5px; border-radius: 3px; font: 500 10px/15px var(--police);
      color: var(--v); background: color-mix(in srgb, var(--v) 9%, #fff); border: 1px solid color-mix(in srgb, var(--v) 28%, #fff);
    }
    .conf { flex: none; width: 30px; text-align: right; color: var(--texte); }

    .enonce {
      margin: 0 10px 8px; padding: 6px 8px; border-radius: 4px; background: #f7f7f5; border: 1px solid #ededea;
      font: 11.5px/1.45 var(--police); color: var(--texte-2);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .enonce.vide { color: var(--texte-3); font-style: italic; }
    .pied {
      height: 24px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
      border-top: 1px solid #efefec; font: 10.5px var(--mono); color: var(--texte-3); border-radius: 0 0 6px 6px;
    }
    .st { display: inline-flex; align-items: center; gap: 6px; color: var(--s); font: 600 10.5px var(--police); letter-spacing: 0.01em; }
    .st i { width: 7px; height: 7px; border-radius: 1.5px; background: var(--s); }
    .pied .nb { margin-left: auto; }

    /* ─── Menu contextuel « Toutes les actions » ─── */
    .menu {
      position: absolute; z-index: 30; width: 290px; max-height: 420px; display: none; flex-direction: column;
      background: #fff; border: 1px solid var(--trait-fort); border-radius: 6px; cursor: default; user-select: none;
      box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.06);
    }
    .menu.ouvert { display: flex; }
    .m-tete { padding: 8px 10px 6px; font: 600 11.5px var(--police); color: var(--texte); display: flex; }
    .m-tete small { margin-left: auto; font-weight: 400; color: var(--texte-3); }
    .m-recherche {
      margin: 0 8px 6px; height: 28px; padding: 0 8px; font: 12.5px var(--police); color: var(--texte);
      border: 1px solid var(--trait-fort); border-radius: 4px; outline: none;
    }
    .m-recherche:focus { border-color: #a1a1aa; }
    .m-liste { overflow-y: auto; padding: 0 0 6px; }
    .m-groupe { padding: 6px 10px 3px; font: 600 10.5px var(--police); letter-spacing: 0.04em; text-transform: uppercase; color: var(--texte-3); }
    .m-item { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px 0 16px; font-size: 12.5px; color: var(--texte); cursor: pointer; }
    .m-item .m-ico { width: 16px; height: 16px; border-radius: 3px; display: grid; place-items: center; font: 600 10px/1 var(--police); color: #fff; background: var(--c, #71717a); }
    .m-item kbd { margin-left: auto; font: 10.5px var(--mono); color: var(--texte-3); }
    .m-item.actif { background: #f1f1ee; }
    .m-vide { padding: 8px 16px; font-size: 12px; color: var(--texte-3); }

    /* ─── Bas de toile : légende et messages ─── */
    .bas {
      position: absolute; left: 12px; bottom: 12px; right: 12px; display: flex; align-items: center; gap: 12px; pointer-events: none;
    }
    .legende-l {
      pointer-events: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 6px 12px;
      font-size: 11.5px; color: var(--texte-2); background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--trait); border-radius: 6px;
    }
    .legende-l span { display: inline-flex; align-items: center; gap: 6px; }
    .legende-l svg { display: block; }
    .message { font-size: 12px; color: var(--texte); background: #fff; border: 1px solid var(--trait-fort); border-radius: 6px; padding: 6px 10px; opacity: 0; transition: opacity 0.2s; }
    .message.visible { opacity: 1; }

    /* ─── Aide raccourcis ─── */
    .aide-pop {
      position: absolute; right: 12px; top: 10px; z-index: 40; width: 380px; display: none; padding: 12px 14px 10px;
      background: #fff; border: 1px solid var(--trait-fort); border-radius: 6px; box-shadow: 0 12px 32px -14px rgba(0, 0, 0, 0.35);
    }
    .aide-pop.ouvert { display: block; }
    .aide-pop h3 { margin: 0 0 8px; font: 600 12.5px var(--police); }
    .aide-pop h4 { margin: 10px 0 4px; font: 600 10.5px var(--police); text-transform: uppercase; letter-spacing: 0.04em; color: var(--texte-3); }
    .aide-pop dl { margin: 0; display: grid; grid-template-columns: 150px 1fr; gap: 3px 10px; font-size: 12px; }
    .aide-pop dt { font: 11px var(--mono); color: var(--texte); }
    .aide-pop dd { margin: 0; color: var(--texte-2); }

    /* ─── Panneau Détails ─── */
    .details {
      position: absolute; top: 0; right: 0; bottom: 0; width: var(--panneau); display: flex; flex-direction: column;
      background: #fff; border-left: 1px solid var(--trait-fort); user-select: text;
    }
    .d-onglet {
      flex: none; height: 32px; display: flex; align-items: center; padding: 0 12px;
      font: 600 12px var(--police); color: var(--texte); background: #f4f4f2; border-bottom: 1px solid var(--trait);
    }
    .d-defil { flex: 1; min-height: 0; overflow-y: auto; }
    .d-tete { display: flex; gap: 10px; padding: 12px; border-bottom: 1px solid var(--trait); }
    .d-ico { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 5px; color: #fff; background: var(--c); font: 600 15px var(--police); }
    .d-tete div { min-width: 0; }
    .d-sur { font: 500 11px var(--police); color: var(--texte-3); }
    .d-titre { margin: 2px 0 0; font: 600 14px/1.35 var(--police); color: var(--texte); overflow-wrap: anywhere; }
    .section { border-bottom: 1px solid var(--trait); }
    .section > h3 {
      margin: 0; height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 12px;
      font: 600 11.5px var(--police); color: var(--texte); background: #fafaf8; border-bottom: 1px solid var(--trait);
    }
    .section > h3 small { margin-left: auto; font: 10.5px var(--mono); color: var(--texte-3); font-weight: 400; }
    .props { padding: 6px 0; }
    .prop { display: grid; grid-template-columns: 92px 1fr; gap: 8px; align-items: center; padding: 3px 12px; font-size: 12px; }
    .prop.haut { align-items: start; }
    .prop.haut > label { padding-top: 5px; }
    .prop > label { color: var(--texte-2); }
    .prop > div { min-width: 0; }
    .champ, .details select, .details textarea {
      width: 100%; min-width: 0; font: 12px var(--police); color: var(--texte); background: #fff;
      border: 1px solid #d4d4d8; border-radius: 4px; outline: none;
    }
    .champ, .details select { height: 26px; padding: 0 7px; }
    .details textarea { padding: 5px 7px; line-height: 1.45; resize: vertical; min-height: 64px; }
    .champ:focus, .details select:focus, .details textarea:focus { border-color: var(--choix); }
    .champ.mono { font-family: var(--mono); font-size: 11.5px; }
    .conf-ligne { display: flex; align-items: center; gap: 8px; }
    .conf-ligne input[type='range'] { flex: 1; min-width: 0; accent-color: #3f3f46; }
    .conf-ligne output { width: 34px; text-align: right; font: 11.5px var(--mono); }
    .coche { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--texte-2); white-space: nowrap; }
    .statut-l { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--s); }
    .statut-l i { width: 8px; height: 8px; border-radius: 2px; background: var(--s); }
    .aide-statut { margin: 2px 12px 8px; font-size: 11.5px; line-height: 1.45; color: var(--texte-3); }
    .liste { list-style: none; margin: 0; padding: 4px 0; }
    .liste li { display: flex; align-items: center; gap: 8px; min-height: 26px; padding: 0 12px; font-size: 12px; }
    .liste li:hover { background: #fafaf8; }
    .liste .lien { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--texte); cursor: pointer; }
    .liste .lien:hover { text-decoration: underline; }
    .liste .pt { flex: none; width: 8px; height: 8px; border-radius: 2px; background: var(--s); }
    .liste .mono { font: 11px var(--mono); color: var(--texte-2); }
    .liste .vide { color: var(--texte-3); }
    .x {
      flex: none; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 3px; background: transparent;
      color: var(--texte-3); font-size: 15px; line-height: 1; cursor: pointer;
    }
    .x:hover { background: #fde8e8; color: var(--echec); }
    .boutons { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px 12px; }
    .bouton {
      height: 26px; padding: 0 10px; font: 500 12px var(--police); color: var(--texte); cursor: pointer;
      background: #fff; border: 1px solid #d4d4d8; border-radius: 4px;
    }
    .bouton:hover { background: #f4f4f2; }
    .bouton.danger { color: var(--echec); }
    .bouton.danger:hover { background: #fdf2f2; border-color: #f0a3a3; }
    .palette { display: flex; gap: 6px; }
    .palette button { width: 20px; height: 20px; padding: 0; border-radius: 4px; cursor: pointer; background: var(--c); border: 2px solid #fff; box-shadow: 0 0 0 1px #d4d4d8; }
    .palette button.actif { box-shadow: 0 0 0 2px var(--texte); }
    .compte { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 8px 12px; font-size: 12px; }
    .compte span:nth-child(even) { font: 11.5px var(--mono); color: var(--texte); text-align: right; }
    .note { padding: 8px 12px 12px; font-size: 11.5px; line-height: 1.5; color: var(--texte-3); }
  </style>
</head>
<body>
  <header class="barre">
    <a class="retour" href="../../logique.html">← Propositions</a>
    <span class="titre">Graphe de logique<small>éditeur Blueprint</small></span>
    <span class="probleme"><b>Problème</b><span data-probleme></span></span>
    <span class="espace"></span>
    <div class="groupe">
      <button data-cmd="annuler" title="Annuler (Ctrl+Z)">Annuler</button>
      <button data-cmd="retablir" title="Rétablir (Ctrl+Y)">Rétablir</button>
    </div>
    <div class="groupe">
      <button data-cmd="cadrer" title="Cadrer la sélection, ou tout (F)">Cadrer<kbd>F</kbd></button>
      <button data-cmd="commentaire" title="Boîte de catégorie autour de la sélection (C)">Commentaire<kbd>C</kbd></button>
      <button data-cmd="aimanter" title="Aimanter les nœuds à la grille">Grille</button>
    </div>
    <div class="groupe">
      <button data-cmd="reinitialiser" title="Revenir au problème d’exemple (annulable)">Réinitialiser l’exemple</button>
      <button data-cmd="aide" title="Raccourcis">?</button>
    </div>
  </header>
  <main class="scene"></main>
  <script type="module" src="./vue.js"></script>
</body>
</html>
