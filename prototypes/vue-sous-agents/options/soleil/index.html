<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas · Soleil</title>
  <link rel="stylesheet" href="../../commun/commun.css">
  <style>
    .scene {
      background:
        radial-gradient(ellipse 60% 70% at 50% 52%, #15171e 0%, var(--fond) 72%);
      user-select: none;
    }
    .ciel { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    /* ── Arcs ── */
    .arc { cursor: pointer; }
    .arc > * { transition: opacity .35s; }
    .arc .fond {
      fill: var(--c);
      fill-opacity: .9;
      stroke: var(--c);
      stroke-width: 0;
      stroke-opacity: 0;
      transition: fill .7s, fill-opacity .7s, stroke-opacity .5s, stroke-width .3s, opacity .35s;
    }
    .arc.etat-reflechit .fond, .arc.etat-outil .fond {
      fill-opacity: .96;
      filter: drop-shadow(0 0 7px color-mix(in srgb, var(--c) 65%, transparent));
    }
    .arc.etat-attend .fond { fill-opacity: .28; stroke-width: 1; stroke-opacity: .55; }
    .arc.etat-en_file .fond {
      fill-opacity: .035;
      stroke-width: 1.2;
      stroke-opacity: .8;
      stroke-dasharray: 3 4;
      animation: defile 1.4s linear infinite;
    }
    .arc.etat-termine .fond { fill: var(--cp); fill-opacity: .6; }
    .arc.etat-echec .fond { fill: var(--echec); fill-opacity: .92; stroke: #ffc2c2; stroke-width: 1; stroke-opacity: .55; }
    @keyframes defile { to { stroke-dashoffset: -14; } }

    .arc .reflet { display: none; pointer-events: none; }
    .arc.etat-reflechit .reflet, .arc.etat-outil .reflet { display: inline; fill: #fff; fill-opacity: .5; filter: url(#flou); }
    .arc.etat-outil .reflet { fill-opacity: .62; }
    .arc.etat-echec .reflet { display: inline; fill: url(#hachures); }
    .arc .onde { fill: none; stroke: var(--onde, var(--c)); pointer-events: none; }

    .arc:hover .fond { stroke: #fff; stroke-opacity: .85; stroke-width: 1.5; }
    .arc.choisi .fond { stroke: #fff; stroke-opacity: 1; stroke-width: 2; stroke-dasharray: none; }
    .arcs.survol .arc:not(.lie) > * { opacity: .28; }

    /* ── Décor ── */
    .guides circle { fill: none; stroke: var(--trait); stroke-dasharray: 1 5; }
    .graduations { stroke: var(--trait-fort); stroke-width: 1; fill: none; }
    .trotteuse { fill: var(--accent); opacity: .8; }
    .traits path { fill: none; stroke-width: 1; }

    /* ── Centre ── */
    .centre .disque { fill: url(#disque); stroke: var(--trait); stroke-width: 1; cursor: pointer; }
    .centre .anneau { fill: none; stroke: var(--c); stroke-width: 2; stroke-opacity: .45; transition: stroke .6s, stroke-opacity .6s; }
    .centre .fileur { fill: none; stroke: var(--c); stroke-width: 3; stroke-linecap: round; display: none;
      filter: drop-shadow(0 0 5px var(--c)); }
    .centre.etat-reflechit .fileur, .centre.etat-outil .fileur { display: inline; }
    .centre.etat-reflechit .anneau, .centre.etat-outil .anneau { stroke-opacity: .18; }
    .centre.etat-en_file .anneau { stroke-dasharray: 3 4; }
    .centre.etat-termine .anneau { stroke: var(--cp); stroke-opacity: .7; }
    .centre.etat-echec .anneau { stroke: var(--echec); stroke-opacity: .9; }

    .info-centre {
      position: absolute; left: 0; top: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .45em;
      text-align: center; overflow: hidden;
      font-size: 12px;
      pointer-events: auto;
    }
    .info-centre.remontable { cursor: zoom-out; }
    .ic-role { font-size: .82em; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--c);
      display: flex; align-items: center; gap: .5em; white-space: nowrap; }
    .ic-role i { width: .6em; height: .6em; border-radius: 50%; background: var(--c); }
    .info-centre.vif .ic-role i { animation: respire 1.2s ease-in-out infinite; box-shadow: 0 0 8px var(--c); }
    .ic-titre { font-size: .92em; line-height: 1.3; color: var(--texte-2);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ic-activite { font-size: 1.05em; font-weight: 500; line-height: 1.28; color: var(--texte);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ic-chiffres { display: flex; gap: .8em; font: 500 1.2em var(--mono); color: var(--texte); white-space: nowrap; }
    .ic-chiffres small { font-size: .65em; color: var(--texte-3); margin-left: .2em; }
    .ic-compteurs { display: flex; gap: .9em; font: .9em var(--mono); color: var(--texte-2); white-space: nowrap; }
    .ic-compteurs span { display: inline-flex; align-items: center; }
    .ic-compteurs b { color: var(--texte); font-weight: 500; }
    .pt { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; flex: none; }
    .pt.vif { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
    .pt.file { border: 1px dashed var(--texte-2); width: 7px; height: 7px; }
    .pt.att { background: var(--texte-3); }
    .ic-actions { display: flex; gap: .6em; align-items: center; white-space: nowrap; }
    .ic-actions button {
      font: 500 .88em var(--police); color: var(--texte); background: var(--fond-3);
      border: 1px solid var(--trait-fort); border-radius: 999px; padding: .2em .8em; cursor: pointer;
    }
    .ic-actions button:hover { border-color: var(--texte-2); }
    .ic-remonter { font-size: .85em; color: var(--texte-3); }
    .info-centre.compact .ic-titre { display: none; }

    /* ── Étiquettes d'activité ── */
    .etiquettes { position: absolute; inset: 0; pointer-events: none; }
    .etiquette { position: absolute; left: 0; top: 0; width: 224px; will-change: transform; }
    .carte {
      padding: 6px 9px 7px;
      background: color-mix(in srgb, var(--fond-2) 86%, transparent);
      border: 1px solid var(--trait);
      border-left: 2px solid var(--c);
      border-radius: 6px;
      animation: apparait .45s ease-out backwards;
      transition: opacity .35s, transform .35s;
      pointer-events: auto; cursor: pointer;
    }
    .etiquette.gauche .carte { border-left: 1px solid var(--trait); border-right: 2px solid var(--c); text-align: right; }
    .carte.sort { opacity: 0; transform: scale(.96); }
    @keyframes apparait { from { opacity: 0; transform: translateY(6px); } }
    .e-tete { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--texte-3); white-space: nowrap; }
    .etiquette.gauche .e-tete { flex-direction: row-reverse; }
    .e-tete i { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); animation: respire 1.2s ease-in-out infinite; }
    .e-tete b { color: var(--c); font-weight: 600; }
    .e-titre { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
    .e-tete time { font: 10px var(--mono); color: var(--texte-3); }
    .e-act { margin-top: 2px; font-size: 12px; line-height: 1.3; color: var(--texte);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .e-act code { font: 10px var(--mono); color: var(--fond); background: var(--c); border-radius: 3px; padding: 0 4px; margin-right: 5px; }
    .etiquette.gauche .e-act code { margin: 0 0 0 5px; }
    .e-act code:empty { display: none; }

    /* ── Fil d'Ariane, légende, bulle ── */
    .fil { position: absolute; left: 18px; top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
      font-size: 12px; color: var(--texte-3); max-width: 40%; }
    .fil button { font: 500 12px var(--police); color: var(--texte-2); background: none; border: 0; padding: 2px 4px; border-radius: 4px; cursor: pointer; }
    .fil button:hover { color: var(--texte); background: var(--fond-3); }
    .fil button.ici { color: var(--texte); cursor: default; background: none; }
    .fil button i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

    .legende-soleil { position: absolute; left: 18px; bottom: 14px; display: flex; flex-direction: column; gap: 7px;
      font-size: 11px; color: var(--texte-3); opacity: .72; transition: opacity .3s; }
    .legende-soleil:hover { opacity: 1; }
    .legende-soleil .ligne { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .legende-soleil .ligne > span { display: inline-flex; align-items: center; gap: 5px; }
    .legende-soleil svg { width: 18px; height: 10px; overflow: visible; }
    .legende-soleil .indice { color: var(--texte-3); font-style: italic; }

    .bulle { position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0; transition: opacity .15s;
      max-width: 280px; padding: 6px 9px; font-size: 12px; line-height: 1.35;
      background: var(--fond-3); border: 1px solid var(--trait-fort); border-radius: 6px; box-shadow: 0 6px 20px #0008; }
    .bulle.visible { opacity: 1; }
    .bulle b { color: var(--c); font-weight: 600; }
    .bulle small { display: block; color: var(--texte-3); font: 10px var(--mono); margin-top: 2px; }

    /* ── Inspecteur ── */
    .inspecteur {
      position: fixed; top: var(--barre); right: 0; bottom: 0; width: 392px; z-index: 50;
      display: flex; flex-direction: column; gap: 12px;
      padding: 18px 18px 0;
      background: color-mix(in srgb, var(--fond-2) 94%, transparent);
      backdrop-filter: blur(12px);
      border-left: 1px solid var(--trait);
      transform: translateX(100%);
      transition: transform .45s cubic-bezier(.2, .8, .2, 1);
    }
    .inspecteur.ouvert { transform: none; box-shadow: -20px 0 40px #0006; }
    .inspecteur .fermer { position: absolute; top: 12px; right: 12px; width: 26px; height: 26px; border-radius: 6px;
      background: none; border: 0; color: var(--texte-2); font-size: 18px; cursor: pointer; }
    .inspecteur .fermer:hover { background: var(--fond-3); color: var(--texte); }
    .i-role { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--c); letter-spacing: .04em; }
    .i-role i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
    .i-modele { font: 400 11px var(--mono); color: var(--texte-2); background: var(--fond-3); border-radius: 4px; padding: 1px 6px; font-style: normal; }
    .i-titre { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35; letter-spacing: -.01em; padding-right: 20px; }
    .i-etat { align-self: flex-start; font: 500 11px var(--police); padding: 3px 9px; border-radius: 999px;
      border: 1px solid var(--trait-fort); color: var(--texte-2); display: inline-flex; align-items: center; gap: 6px; }
    .i-etat.vif { color: var(--fond); background: var(--c); border-color: var(--c); }
    .i-etat.en_file { border-style: dashed; }
    .i-etat.echec { color: #fff; background: var(--echec); border-color: var(--echec); }
    .i-etat.attend { color: var(--c); border-color: color-mix(in srgb, var(--c) 50%, transparent); }
    .i-chiffres { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; margin: 0;
      background: var(--trait); border: 1px solid var(--trait); border-radius: 8px; overflow: hidden; }
    .i-chiffres div { background: var(--fond-2); padding: 7px 9px; }
    .i-chiffres dt { font-size: 10px; color: var(--texte-3); text-transform: uppercase; letter-spacing: .06em; }
    .i-chiffres dd { margin: 2px 0 0; font: 500 14px var(--mono); }
    .i-bloc h3, .i-journal-titre { margin: 0 0 4px; font-size: 10px; font-weight: 600; color: var(--texte-3); text-transform: uppercase; letter-spacing: .08em; }
    .i-bloc p { margin: 0; font-size: 13px; line-height: 1.4; }
    .i-resultat.echec { color: var(--echec); }
    .i-liens div { display: flex; flex-wrap: wrap; gap: 5px; }
    .i-liens button { font: 11px var(--police); color: var(--texte-2); background: var(--fond-3); border: 1px solid var(--trait);
      border-radius: 5px; padding: 2px 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
    .i-liens button:hover { color: var(--texte); border-color: var(--trait-fort); }
    .i-liens button i { width: 6px; height: 6px; border-radius: 50%; }
    .i-liens button.parent::before { content: '↑'; color: var(--texte-3); }
    .i-journal { flex: 1; min-height: 80px; overflow-y: auto; margin: 0 -18px; padding: 0 18px 18px; list-style: none;
      border-top: 1px solid var(--trait); }
    .i-journal li { display: grid; grid-template-columns: 52px 10px 1fr; gap: 6px; align-items: baseline;
      padding: 5px 0; font-size: 12px; line-height: 1.35; border-bottom: 1px solid color-mix(in srgb, var(--trait) 50%, transparent);
      animation: apparait .35s ease-out backwards; }
    .i-journal time { font: 10px var(--mono); color: var(--texte-3); }
    .i-journal i { width: 6px; height: 6px; border-radius: 50%; background: var(--texte-3); }
    .i-journal .j-demarre i, .i-journal .j-termine i { background: var(--ok); }
    .i-journal .j-echec i { background: var(--echec); }
    .i-journal .j-echec span { color: var(--echec); }
    .i-journal .j-reflechit i { background: var(--c); }
    .i-journal .j-outil i { background: var(--c); border-radius: 1px; }
    .i-journal .j-attend i { background: none; border: 1px solid var(--texte-3); }
  </style>
</head>
<body>
  <main class="scene"></main>
  <script type="module" src="./vue.js"></script>
</body>
</html>
