<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arbre de comportement · Atlas</title>
  <link rel="stylesheet" href="../../commun/commun.css">
  <link rel="stylesheet" href="../../commun/clair.css">
  <style>
    :root {
      --bb: 280px;
      --panneau: 360px;
      --actif: #2563eb;
      --chemin: #27272a;
      --t-composite: #475569;
      --t-tache: #6d28d9;
      --t-service: #0f766e;
      --pale-ok: #ecfdf3;
      --pale-ok-t: #166534;
      --pale-echec: #fef2f2;
      --pale-echec-t: #b91c1c;
    }

    .scene {
      cursor: grab;
      user-select: none;
      background-color: #fafaf9;
      background-image:
        linear-gradient(to right, #ecece8 1px, transparent 1px),
        linear-gradient(to bottom, #ecece8 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .scene:active { cursor: grabbing; }

    .monde { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
    .liens { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; }
    .noeuds { position: absolute; left: 0; top: 0; }

    /* ─── Panneaux (Blackboard, Détails) ─── */
    .panneau-ue {
      position: absolute; z-index: 10; display: flex; flex-direction: column; overflow: hidden;
      cursor: default; user-select: text;
      background: #fff; border: 1px solid var(--trait-fort); border-radius: 6px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px -12px rgba(0, 0, 0, 0.12);
    }
    .onglet {
      display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; flex: none;
      font: 600 12px var(--police); color: var(--texte); background: var(--fond-3);
      border-bottom: 1px solid var(--trait-fort);
    }
    .onglet svg { width: 14px; height: 14px; color: var(--texte-2); flex: none; }
    .onglet small { margin-left: auto; font: 400 11px var(--mono); color: var(--texte-3); }

    .blackboard { left: 12px; top: 12px; width: var(--bb); max-height: calc(100% - 24px); }
    .bb-cles { margin: 0; padding: 4px 0; overflow-y: auto; }
    .bb-ligne { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 12px; border-bottom: 1px solid var(--trait); }
    .bb-ligne:last-child { border-bottom: 0; }
    .bb-ligne dt { font: 500 11.5px var(--mono); color: var(--texte); }
    .bb-ligne .type { font: 400 10px var(--mono); color: var(--texte-3); text-align: right; }
    .bb-ligne dd { grid-column: 1 / -1; margin: 0; font: 12px/1.4 var(--police); color: var(--texte-2); overflow-wrap: anywhere; }
    .bb-ligne dd.nombre { font: 500 12.5px var(--mono); color: var(--texte); }
    .bb-ligne dd .jauge { display: flex; gap: 3px; margin-top: 5px; }
    .bb-ligne dd .jauge i { flex: 1; height: 6px; border-radius: 1px; background: var(--trait); }
    .bb-ligne dd .jauge i.pris { background: var(--actif); }
    .bb-ligne ul { list-style: none; margin: 2px 0 0; padding: 0; }
    .bb-ligne li { display: flex; gap: 6px; font-size: 11.5px; line-height: 1.55; white-space: nowrap; }
    .bb-ligne li b { font: 500 10.5px var(--mono); color: var(--texte-3); min-width: 20px; }
    .bb-ligne li span { overflow: hidden; text-overflow: ellipsis; }
    .bb-ligne li .r { flex: none; font-weight: 500; }
    .bb-vide { color: var(--texte-3); font-style: italic; }

    /* ─── Nœuds ─── */
    .noeud { position: absolute; left: 0; top: 0; will-change: transform; transition: opacity 0.3s; }
    .noeud.sort { opacity: 0; pointer-events: none; }

    .boite {
      position: relative; width: 212px; height: 84px; overflow: hidden; cursor: pointer;
      display: flex; flex-direction: column;
      background: #fff; border: 1px solid var(--trait-fort); border-radius: 5px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
    .boite:hover { border-color: #a1a1aa; }
    .bandeau { height: 4px; flex: none; background: var(--t); }
    .entete {
      display: flex; align-items: center; gap: 5px; height: 20px; padding: 3px 8px 0 9px;
      font: 600 9.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--t);
    }
    .entete svg { width: 12px; height: 12px; flex: none; }
    .index {
      margin-left: auto; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px;
      display: grid; place-items: center; font: 600 10px var(--mono); letter-spacing: 0;
      color: var(--texte-2); background: var(--fond-3); border: 1px solid var(--trait-fort);
    }
    .corps { padding: 1px 9px 0; min-width: 0; }
    .role { font: 600 12px/1.3 var(--police); color: var(--c); }
    .titre-n {
      font: 12px/1.3 var(--police); color: var(--texte);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pied {
      display: flex; align-items: center; gap: 6px; margin-top: auto; height: 22px; padding: 0 8px 0 9px;
      border-top: 1px solid var(--trait); background: #fcfcfb;
      font: 10.5px var(--mono); color: var(--texte-2); white-space: nowrap;
    }
    .badge {
      flex: none; padding: 0 6px; border-radius: 3px; line-height: 16px; font: 600 10px var(--police);
      border: 1px solid transparent;
    }
    .pied .detail { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .pied .chrono { flex: none; color: var(--texte-3); }

    .b-cours { color: #fff; background: var(--actif); }
    .b-attend { color: var(--texte-2); background: var(--fond-3); border-color: var(--trait-fort); }
    .b-file { color: var(--texte-3); border-color: var(--trait-fort); border-style: dashed; }
    .b-ok { color: var(--pale-ok-t); background: var(--pale-ok); border-color: #bbf7d0; }
    .b-echec { color: var(--pale-echec-t); background: var(--pale-echec); border-color: #fecaca; }

    /* Broches façon UE */
    .broche {
      position: absolute; left: 50%; width: 26px; height: 6px; margin-left: -13px;
      background: #d4d4d0; border: 1px solid #b8b8b2; border-radius: 2px;
    }
    .broche.haut { top: -5px; }
    .broche.bas { top: 83px; display: none; }
    .noeud.parent .broche.bas { display: block; }
    .noeud.racine .broche.haut { display: none; }
    .noeud.sur-chemin .broche { background: var(--chemin); border-color: var(--chemin); }

    /* États (mode débogage) */
    .noeud.e-en_file .boite { border-style: dashed; background: #fcfcfb; }
    .noeud.e-en_file .role, .noeud.e-en_file .titre-n { color: var(--texte-3); }
    .noeud.e-attend.sur-chemin .boite { border-color: var(--chemin); box-shadow: 0 0 0 1px var(--chemin); }
    .noeud.vivant .boite { border-color: var(--actif); box-shadow: 0 0 0 2px var(--actif); }
    .noeud.vivant .pied { background: #eff6ff; border-top-color: #bfdbfe; color: #1e3a8a; }
    .noeud.e-echec .boite { border-color: #f5a3a3; }
    .noeud.choisi .boite { outline: 2px solid var(--texte); outline-offset: 3px; }

    .replier {
      position: absolute; left: 50%; top: 92px; transform: translateX(-50%); padding: 0 7px; height: 18px;
      display: none; cursor: pointer; font: 600 10.5px var(--mono); color: var(--texte-2);
      background: #fff; border: 1px solid var(--trait-fort); border-radius: 3px;
    }
    .replier:hover { color: var(--texte); border-color: #a1a1aa; }
    .noeud.repliable .replier { display: block; }

    /* ─── Liens orthogonaux ─── */
    .liens path { fill: none; stroke-linejoin: round; transition: opacity 0.3s; }
    .liens .l-normal path { stroke: #b8b8b2; stroke-width: 1.4; }
    .liens .l-normal path.file { stroke-dasharray: 4 3; }
    .liens .l-normal path.echec { stroke: #f5a3a3; }
    .liens .l-chemin path { stroke: var(--chemin); stroke-width: 2.6; }
    .liens path.sort { opacity: 0; }

    /* ─── Détails ─── */
    .details {
      top: 12px; right: 12px; bottom: 12px; width: var(--panneau);
      transform: translateX(calc(100% + 24px)); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .details.ouvert { transform: none; }
    .d-fermer {
      margin-left: auto; width: 22px; height: 22px; padding: 0; cursor: pointer; border: 0; border-radius: 4px;
      background: transparent; color: var(--texte-2); font-size: 16px; line-height: 1;
    }
    .d-fermer:hover { background: var(--trait); color: var(--texte); }
    .d-tete { padding: 12px 14px 10px; border-bottom: 1px solid var(--trait); }
    .d-type { display: flex; align-items: center; gap: 6px; font: 600 10px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--t); }
    .d-type svg { width: 12px; height: 12px; }
    .d-titre { margin: 6px 0 8px; font: 600 14.5px/1.35 var(--police); color: var(--texte); }
    .d-section {
      height: 26px; display: flex; align-items: center; padding: 0 14px; flex: none;
      font: 600 11px var(--police); color: var(--texte-2); background: var(--fond-3);
      border-bottom: 1px solid var(--trait);
    }
    .d-props { margin: 0; }
    .d-props div { display: grid; grid-template-columns: 112px 1fr; border-bottom: 1px solid var(--trait); }
    .d-props dt { padding: 5px 14px; font-size: 11.5px; color: var(--texte-2); border-right: 1px solid var(--trait); }
    .d-props dd { margin: 0; padding: 5px 10px; font: 11.5px var(--mono); color: var(--texte); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .d-props dd.texte { white-space: normal; font-family: var(--police); line-height: 1.4; }
    .d-props dd.lienable { cursor: pointer; color: var(--actif); text-decoration: underline; text-underline-offset: 2px; }
    .d-props dd.echec { color: var(--pale-echec-t); }
    .d-journal { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 0; list-style: none; font: 11px/1.45 var(--mono); }
    .d-journal li { display: grid; grid-template-columns: 44px 62px 1fr; gap: 6px; padding: 4px 14px; border-bottom: 1px solid var(--trait); }
    .d-journal time { color: var(--texte-3); }
    .d-journal b { font-weight: 500; color: var(--texte-3); }
    .d-journal span { color: var(--texte-2); word-break: break-word; }
    .d-journal li[data-e='reflechit'] b, .d-journal li[data-e='outil'] b, .d-journal li[data-t='demarre'] b { color: var(--actif); }
    .d-journal li[data-t='termine'] b { color: var(--pale-ok-t); }
    .d-journal li[data-t='echec'] b, .d-journal li[data-t='echec'] span { color: var(--pale-echec-t); }

    /* ─── Légende, recadrage ─── */
    .legende-bt {
      position: absolute; left: calc(var(--bb) + 28px); bottom: 12px; z-index: 5; cursor: default;
      display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 6px 10px;
      font-size: 11px; color: var(--texte-2); background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--trait); border-radius: 5px;
    }
    .legende-bt span { display: inline-flex; align-items: center; gap: 5px; }
    .legende-bt .t { width: 16px; height: 4px; border-radius: 1px; background: var(--t); }
    .legende-bt .c { width: 18px; height: 0; border-top: 2.6px solid var(--chemin); }
    .legende-bt .a { width: 12px; height: 10px; border-radius: 2px; box-shadow: inset 0 0 0 2px var(--actif); }
    .legende-bt .aide { color: var(--texte-3); }

    .recadrer {
      position: absolute; right: 16px; bottom: 12px; z-index: 6; padding: 5px 11px; cursor: pointer;
      font: 500 12px var(--police); color: var(--texte-2); background: #fff;
      border: 1px solid var(--trait-fort); border-radius: 5px; display: none;
    }
    .recadrer.visible { display: block; }
    .recadrer:hover { color: var(--texte); }
    .scene.avec-details .recadrer { right: calc(var(--panneau) + 28px); }
  </style>
</head>
<body>
  <main class="scene"></main>
  <script type="module" src="./vue.js"></script>
</body>
</html>
