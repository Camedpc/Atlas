<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rails — vue des sous-agents</title>
  <link rel="stylesheet" href="../../commun/commun.css">
  <style>
    .scene {
      background:
        radial-gradient(900px 420px at 18% 105%, rgba(240, 164, 75, 0.06), transparent 70%),
        var(--fond);
    }
    .scene::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      box-shadow: inset 0 0 90px rgba(239, 91, 91, 0.28);
    }
    .scene.flash::after { animation: flash 1.1s ease-out; }
    @keyframes flash { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; } }

    canvas.rails { position: absolute; left: 0; top: 0; pointer-events: none; }
    .defil {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--trait-fort) transparent;
    }
    .plan { width: 1px; }

    .direct {
      position: absolute;
      left: 50%;
      bottom: 56px;
      transform: translate(-50%, 14px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .35s cubic-bezier(.2, .8, .2, 1);
      font: 500 12px var(--police);
      color: var(--fond);
      background: var(--accent);
      border: 0;
      border-radius: 999px;
      padding: 7px 14px 7px 12px;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(240, 164, 75, 0.25);
      z-index: 5;
    }
    .direct.visible { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .direct:hover { filter: brightness(1.08); }

    .legende {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 22px 16px 10px 16px;
      background: linear-gradient(to bottom, transparent, var(--fond) 55%);
      pointer-events: none;
      font-size: 11px;
      color: var(--texte-3);
      gap: 14px;
      align-items: center;
      z-index: 4;
    }
    .legende svg { margin-right: 5px; overflow: visible; }
    .legende .sep { width: 1px; height: 12px; background: var(--trait); }
    .legende .roles { display: inline-flex; gap: 10px; }
    .legende .aide { margin-left: auto; font-family: var(--mono); }

    .inspecteur {
      --c: var(--texte);
      position: absolute;
      top: 12px;
      right: 12px;
      bottom: 12px;
      width: 364px;
      display: flex;
      flex-direction: column;
      background: color-mix(in srgb, var(--fond-2) 90%, transparent);
      backdrop-filter: blur(14px);
      border: 1px solid var(--trait);
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      transform: translateX(calc(100% + 28px));
      transition: transform .4s cubic-bezier(.2, .8, .2, 1);
      overflow: hidden;
      z-index: 6;
    }
    .inspecteur.ouvert { transform: none; }
    .inspecteur::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--c);
      opacity: .8;
    }
    .inspecteur header { display: flex; align-items: center; gap: 8px; padding: 14px 14px 0 18px; }
    .inspecteur .role {
      font: 600 11px var(--police);
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--c);
    }
    .inspecteur .id { font: 12px var(--mono); color: var(--texte-3); }
    .inspecteur .fermer {
      margin-left: auto;
      background: transparent;
      border: 0;
      color: var(--texte-3);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .inspecteur .fermer:hover { color: var(--texte); background: var(--fond-3); }
    .inspecteur h2 { margin: 8px 18px 4px; font-size: 15px; font-weight: 600; line-height: 1.35; letter-spacing: -.01em; }
    .inspecteur .activite { margin: 0 18px 12px; font-size: 12px; color: var(--texte-2); line-height: 1.4; min-height: 17px; }
    .bande { display: flex; align-items: center; height: 10px; margin: 0 18px 14px; gap: 1px; }
    .bande span { height: 100%; min-width: 1px; }
    .bande .b-reflechit { background: var(--c); border-radius: 2px; }
    .bande .b-outil { height: 6px; background: repeating-linear-gradient(90deg, var(--c) 0 2px, transparent 2px 5px), linear-gradient(var(--c), var(--c)) center / 100% 2px no-repeat; }
    .bande .b-attend { height: 1px; background: var(--c); opacity: .7; }
    .bande .b-en_file { height: 0; border-top: 1.5px dashed var(--c); opacity: .6; }
    .inspecteur dl {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 14px;
      margin: 0 18px 12px;
      padding: 12px 0;
      border-top: 1px solid var(--trait);
      border-bottom: 1px solid var(--trait);
    }
    .inspecteur dt { font-size: 10.5px; color: var(--texte-3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
    .inspecteur dd { margin: 0; font: 12.5px var(--mono); color: var(--texte); }
    .inspecteur .large { grid-column: 1 / -1; }
    .puce {
      font: 11px var(--mono);
      color: var(--texte-2);
      background: var(--fond-3);
      border: 1px solid var(--trait);
      border-radius: 6px;
      padding: 2px 6px;
      margin: 0 4px 4px 0;
      cursor: pointer;
    }
    .puce:hover { color: var(--texte); border-color: var(--trait-fort); }
    .puce i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
    .resultat { margin: 0 18px 12px; }
    .resultat p { margin: 4px 0 0; font: 12.5px var(--mono); color: var(--texte-2); }
    .resultat p.echec { color: var(--echec); }
    .resultat p.termine { color: var(--ok); }
    .inspecteur h3 { margin: 0 18px 6px; font-size: 10.5px; font-weight: 500; color: var(--texte-3); text-transform: uppercase; letter-spacing: .05em; }
    .journal {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 0 12px 14px 18px;
      font: 11.5px/1.45 var(--mono);
      scrollbar-width: thin;
      scrollbar-color: var(--trait-fort) transparent;
      mask-image: linear-gradient(to bottom, transparent 0, #000 12px);
    }
    .journal li { display: flex; gap: 10px; padding: 3px 0; color: var(--texte-2); animation: entree .35s ease-out; }
    .journal time { color: var(--texte-3); flex: none; }
    .journal .j-etat.e-reflechit, .journal .j-etat.e-outil { color: var(--texte); }
    .journal .j-lance, .journal .j-demarre { color: var(--texte-3); }
    .journal .j-termine { color: var(--ok); }
    .journal .j-echec { color: var(--echec); }
    @keyframes entree { from { opacity: 0; transform: translateX(6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <main class="scene">
    <canvas class="rails"></canvas>
    <div class="defil"><div class="plan"></div></div>
    <button class="direct" type="button">↓ Revenir au direct</button>

    <footer class="legende">
      <span><svg width="10" height="16"><line x1="5" y1="1" x2="5" y2="15" stroke="#cfc9b8" stroke-width="5"/></svg>réfléchit</span>
      <span><svg width="10" height="16"><line x1="5" y1="1" x2="5" y2="15" stroke="#cfc9b8" stroke-width="2.5"/><path d="M1 3.5h8M1 8h8M1 12.5h8" stroke="#cfc9b8" stroke-width="1.3"/></svg>outil</span>
      <span><svg width="10" height="16"><line x1="5" y1="1" x2="5" y2="15" stroke="#cfc9b8" stroke-width="1.2" opacity=".8"/></svg>attend ses sous-agents</span>
      <span><svg width="10" height="16"><line x1="5" y1="1" x2="5" y2="15" stroke="#cfc9b8" stroke-width="1.5" stroke-dasharray="2 4" opacity=".7"/></svg>en file</span>
      <span><svg width="12" height="16"><line x1="6" y1="0" x2="6" y2="16" stroke="#cfc9b8" stroke-width="2"/><circle cx="6" cy="8" r="3.2" fill="#0e0f12" stroke="#cfc9b8" stroke-width="1.5"/></svg>changement d’état</span>
      <span><svg width="22" height="16"><path d="M18 0v2C18 9 4 7 4 13" fill="none" stroke="#cfc9b8" stroke-width="2"/><line x1="4" y1="0" x2="4" y2="16" stroke="#cfc9b8" stroke-width="1.2" opacity=".6"/><circle cx="4" cy="13" r="3.4" fill="#0e0f12" stroke="#cfc9b8" stroke-width="1.8"/></svg>fusion du résultat</span>
      <span><svg width="12" height="16"><path d="M2.5 4.5l7 7M9.5 4.5l-7 7" stroke="#ef5b5b" stroke-width="2" stroke-linecap="round"/></svg>échec</span>
      <span class="sep"></span>
      <span class="roles"></span>
      <span class="aide"><span data-echelle>16 px/s</span> · Ctrl + molette : échelle · clic : inspecter</span>
    </footer>

    <aside class="inspecteur" aria-hidden="true">
      <header>
        <span class="role" data-i="role"></span>
        <span class="id" data-i="id"></span>
        <button class="fermer" type="button" title="Fermer (Échap)">×</button>
      </header>
      <h2 data-i="titre"></h2>
      <p class="activite" data-i="activite"></p>
      <div class="bande" data-i="bande"></div>
      <dl>
        <div><dt>Modèle</dt><dd data-i="modele"></dd></div>
        <div><dt>État</dt><dd data-i="etat"></dd></div>
        <div class="large"><dt>Durée</dt><dd data-i="duree"></dd></div>
        <div><dt>Tokens</dt><dd data-i="tokens"></dd></div>
        <div><dt>Appels d’outils</dt><dd data-i="outils"></dd></div>
        <div class="large"><dt>Parent · sous-agents</dt><dd data-i="famille"></dd></div>
      </dl>
      <div class="resultat"><dt>Résultat</dt><p data-i="resultat"></p></div>
      <h3>Journal</h3>
      <ol class="journal" data-i="journal"></ol>
    </aside>
  </main>
  <script type="module" src="./vue.js"></script>
</body>
</html>
