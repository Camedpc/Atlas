# Blueprint Render : New → Blueprint, puis choisir le dépôt et la branche.
# Les valeurs `sync: false` sont demandées à la création (secrets, jamais committés).
services:
  # Back FastAPI : les agents tournent plusieurs minutes dans un thread de fond,
  # il faut donc une instance toujours allumée (pas l'offre gratuite, qui se met en veille)
  # et une seule instance (l'état du run en cours est en mémoire).
  - type: web
    name: atlas-api
    runtime: python
    rootDir: backend
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SUPABASE_URL
        value: https://uykaupigovrvgwsckbcn.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MODELE_CHERCHEUR
        value: claude-opus-5
      - key: MODELE_VERIFICATEUR
        value: claude-opus-5
      # À ajuster si Render attribue une autre URL au front.
      - key: CORS_ORIGINS
        value: https://atlas-front.onrender.com

  # Front Vite : site statique (gratuit). Les VITE_* sont intégrées au build :
  # toute modification demande un redéploiement.
  - type: web
    name: atlas-front
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SUPABASE_URL
        value: https://uykaupigovrvgwsckbcn.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # À ajuster si Render attribue une autre URL au back.
      - key: VITE_API_URL
        value: https://atlas-api.onrender.com
